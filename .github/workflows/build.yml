name: build

on:
  pull_request:
  workflow_call:
  workflow_dispatch:
    inputs:
      network-tests:
        description: Also run the DNS/ICMP tests that need the public internet.
        type: boolean
        default: false
  schedule:
    # Weekly, Monday 06:00 UTC: the only run of the DNS/ICMP tests, which need
    # the public internet and are skipped everywhere else.
    - cron: '0 6 * * 1'

permissions:
  contents: read

# One run per branch; a newer push to a PR cancels the run it supersedes.
# The "build-" prefix matters: when this workflow is called by release.yml on a
# tag, github.workflow is "release" and github.ref the tag, so without it the
# group would equal the caller's own (release-refs/tags/vX) and GitHub refuses
# to queue a reusable workflow inside its caller's concurrency group -- the test
# job silently never starts and the release fails.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  # Gate for the DNS/ICMP tests. '1' only on the weekly schedule and on manual
  # runs that ask for it. (The one test that needs ICMP echo to *succeed*
  # additionally skips itself on GitHub-hosted runners -- see TestEnvironment.)
  DEUCALION_TESTS_NETWORK: ${{ (github.event_name == 'schedule' || inputs.network-tests == true) && '1' || '0' }}

# The build and test steps are the Invoke-Build tasks from Deucalion.build.ps1,
# not a second copy of them: one build definition, exercised here and locally.

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Node first: deucalion-ui.esproj is part of the solution and shells out
      # to `npm install` during `dotnet build`, so the pinned Node must already
      # be on PATH.
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: npm
          cache-dependency-path: src/ts/deucalion-ui/package-lock.json

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install Invoke-Build
        shell: pwsh
        run: Install-Module InvokeBuild -Scope CurrentUser -Force

      # Same prerequisites the Dockerfile installs for the Native AOT publish.
      - name: Install Native AOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      # Version (GitVersion from the tool manifest; falls back to 0.0.0-dev on
      # this shallow clone), Clear, AOT publish of Deucalion.Service into
      # ./publish, `npm ci` and the Vite build into ./publish/wwwroot.
      - name: Build (Invoke-Build)
        shell: pwsh
        run: Invoke-Build Build

      # `dotnet test -c Release` with the minimum-expected-tests floor, vitest,
      # eslint. The Release build it produces is what the e2e step reuses.
      - name: Test (Invoke-Build)
        shell: pwsh
        run: Invoke-Build Test

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('src/ts/deucalion-ui/package-lock.json') }}

      - name: Install Playwright browser + system deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: src/ts/deucalion-ui
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (browser cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: src/ts/deucalion-ui
        run: npx playwright install-deps chromium

      - name: Test frontend (e2e)
        working-directory: src/ts/deucalion-ui
        # The suite reuses the Release build produced above (see the webServer
        # command in playwright.config.ts) instead of recompiling in Debug.
        run: npx playwright test --reporter=list

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          path: |
            src/ts/deucalion-ui/test-results/
            src/ts/deucalion-ui/playwright-report/
          retention-days: 7

  # The product ships as a Windows Service and the build script is
  # PowerShell; this leg runs the Test task on Windows. The AOT publish is
  # covered by the Linux leg and the Docker build; e2e is platform-independent
  # and runs on Linux only.
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: npm
          cache-dependency-path: src/ts/deucalion-ui/package-lock.json

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install Invoke-Build
        shell: pwsh
        run: Install-Module InvokeBuild -Scope CurrentUser -Force

      - name: Install npm dependencies
        working-directory: src/ts/deucalion-ui
        run: npm ci

      - name: Test (Invoke-Build)
        shell: pwsh
        run: Invoke-Build Test

  # Build-only Docker/AOT image (amd64) so trim and AOT publish failures
  # surface on the PR instead of on the `edge` push after merge.
  docker:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/docker-publish.yml
    permissions:
      contents: read
    with:
      push: false
