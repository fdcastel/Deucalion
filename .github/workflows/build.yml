name: build

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore .NET dependencies
        run: dotnet restore

      - name: Build .NET
        run: dotnet build --no-restore -c Release

      - name: Test .NET
        run: dotnet test --no-build -c Release

      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: npm
          cache-dependency-path: src/ts/deucalion-ui/package-lock.json

      - name: Install npm dependencies
        working-directory: src/ts/deucalion-ui
        run: npm ci

      - name: Lint frontend
        working-directory: src/ts/deucalion-ui
        run: npm run lint

      - name: Build frontend
        working-directory: src/ts/deucalion-ui
        run: npm run build

      - name: Test frontend (unit)
        working-directory: src/ts/deucalion-ui
        run: npm test

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('src/ts/deucalion-ui/package-lock.json') }}

      - name: Install Playwright browser + system deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: src/ts/deucalion-ui
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (browser cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: src/ts/deucalion-ui
        run: npx playwright install-deps chromium

      - name: Test frontend (e2e)
        working-directory: src/ts/deucalion-ui
        # The suite reuses the Release build produced above (see the webServer
        # command in playwright.config.ts) instead of recompiling in Debug.
        run: npx playwright test --reporter=list

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          path: |
            src/ts/deucalion-ui/test-results/
            src/ts/deucalion-ui/playwright-report/
          retention-days: 7
