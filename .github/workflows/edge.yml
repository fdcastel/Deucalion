name: edge

on:
  push:
    branches: ['master']

permissions:
  contents: read
  packages: write

# Serialize master pushes so two runs never race to push the `:edge` manifest.
# A newer push supersedes the one in flight.
concurrency:
  group: edge
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      packages: read

  docker:
    needs: test
    uses: ./.github/workflows/docker-publish.yml
    permissions:
      contents: read
      packages: write
    with:
      push: true
      tags: edge
