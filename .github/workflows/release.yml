name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

# One run per tag; never cancel a release in flight.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      packages: read

  docker:
    needs: test
    uses: ./.github/workflows/docker-publish.yml
    permissions:
      contents: read
      packages: write
    with:
      push: true
      tags: |
        {majorMinorPatch}
        {major}.{minor}
        {major}
        latest

  release:
    needs: docker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create ${{ github.ref_name }} --repo ${{ github.repository }} --generate-notes
