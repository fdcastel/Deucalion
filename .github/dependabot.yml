version: 2

# Keeps dependency updates arriving as reviewable PRs instead of manual sweeps.
# Grouped so a routine week is one PR per ecosystem rather than a dozen; majors
# stay separate because they need a decision (peer-dependency fallout, ABI
# changes) rather than a rubber stamp.
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dotnet-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /src/ts/deucalion-ui
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    # typescript-eslint@8.68.0 (latest) peers typescript ">=4.8.4 <6.1.0", so the
    # TypeScript 7 major (the native port) cannot resolve yet. Ignored so it does
    # not reappear weekly as red noise; revisit when typescript-eslint supports it.
    # (ESLint 10 and jest-dom 7, previously listed here, resolve since
    # eslint-plugin-solid 0.17 / vite-plugin-solid 2.11.14 and were applied.)
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"
